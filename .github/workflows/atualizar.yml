name: Atualizar M3U

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout completo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Instalar Chromium
        run: python -m playwright install --with-deps chromium

      - name: Testes
        run: pytest -q

      - name: Gerar M3U
        run: python gerar_m3u.py

      - name: Publicar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add canais.m3u catalogo.json relatorio.json
          git diff --cached --quiet || git commit -m "Atualização automática da playlist"
          git push
